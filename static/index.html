<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediScan+ | Intelligent Prescription Parsing</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(79, 70, 229, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15) 0%, transparent 50%);
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        main {
            width: 100%;
            max-width: 800px;
            display: grid;
            gap: 2rem;
        }

        /* Upload Container */
        .upload-container {
            background-color: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 1rem;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .upload-container:hover, .upload-container.dragover {
            border-color: var(--primary);
            background-color: rgba(79, 70, 229, 0.05);
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .upload-text {
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        #file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Preview Area */
        #preview-section {
            display: none;
            background-color: var(--surface);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.4s ease-out;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .preview-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .preview-actions button {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .preview-actions button:hover {
            background-color: var(--surface-hover);
            color: var(--text-main);
        }

        #preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 0.5rem;
            margin: 0 auto;
            display: block;
            object-fit: contain;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.2s ease;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            background-color: var(--surface-hover);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Results Area */
        #results-section {
            display: none;
            background-color: var(--surface);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--primary);
            animation: slideUp 0.5s ease-out;
        }

        .results-header {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--success);
        }

        .results-header h2 {
            color: var(--text-main);
            font-size: 1.5rem;
        }

        /* JSON formatting */
        .data-card {
            background-color: #0b1120;
            border-radius: 0.5rem;
            padding: 1.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            overflow-x: auto;
            border: 1px solid var(--border);
        }

        .key { color: #818cf8; }
        .string { color: #34d399; }
        .null { color: #f87171; }
        
        /* Loading animation */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #error-message {
            display: none;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            border-left: 4px solid var(--error);
        }
    </style>
</head>
<body>

    <header>
        <h1>MediScan+</h1>
        <p class="subtitle">AI-Powered Optical Character Recognition for Medical Prescriptions</p>
    </header>

    <main>
        <!-- File Upload Section -->
        <div class="upload-container" id="drop-zone">
            <span class="upload-icon">📄</span>
            <div class="upload-text">Drag & drop your prescription</div>
            <div class="upload-hint">or click to browse files (PNG, JPG)</div>
            <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg">
        </div>

        <!-- Preview Section -->
        <div id="preview-section">
            <div class="preview-header">
                <span class="preview-title">Image Preview</span>
                <div class="preview-actions">
                    <button id="btn-clear">Clear</button>
                </div>
            </div>
            <img id="preview-image" src="" alt="Preview">
            
            <button id="btn-extract" class="btn-primary">
                <span class="btn-text">Extract Data via Gemini 2.5 Flash</span>
                <div class="loader" id="loader"></div>
            </button>
            
            <div id="error-message"></div>
        </div>

        <!-- Results Section -->
        <div id="results-section">
            <div class="results-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <h2>Extraction Successful</h2>
            </div>
            <div class="data-card" id="json-output">
                <!-- JSON goes here -->
            </div>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewSection = document.getElementById('preview-section');
        const previewImage = document.getElementById('preview-image');
        const btnClear = document.getElementById('btn-clear');
        const btnExtract = document.getElementById('btn-extract');
        const loader = document.getElementById('loader');
        const btnText = document.querySelector('.btn-text');
        const errorMessage = document.getElementById('error-message');
        const resultsSection = document.getElementById('results-section');
        const jsonOutput = document.getElementById('json-output');

        let currentFile = null;

        // Visual feedback for drag and drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        // Handle file drop
        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        // Handle file dialog selection
        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    currentFile = file;
                    
                    // Show preview
                    const reader = new FileReader();
                    reader.onload = e => {
                        previewImage.src = e.target.result;
                        dropZone.style.display = 'none';
                        previewSection.style.display = 'block';
                        resultsSection.style.display = 'none';
                        errorMessage.style.display = 'none';
                    };
                    reader.readAsDataURL(file);
                } else {
                    showError("Please select a valid image file.");
                }
            }
        }

        // Clear selection
        btnClear.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            dropZone.style.display = 'block';
            previewSection.style.display = 'none';
            resultsSection.style.display = 'none';
            errorMessage.style.display = 'none';
        });

        // Syntax highlighting for JSON
        function syntaxHighlight(json) {
            if (typeof json != 'string') {
                json = JSON.stringify(json, undefined, 2);
            }
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        // Handle Extraction
        btnExtract.addEventListener('click', async () => {
            if (!currentFile) return;

            // Set loading state
            btnExtract.disabled = true;
            btnText.textContent = "Processing...";
            loader.style.display = "block";
            errorMessage.style.display = "none";
            resultsSection.style.display = "none";

            const formData = new FormData();
            formData.append('file', currentFile);

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Server error occurred");
                }

                const data = await response.json();
                
                // Show results
                jsonOutput.innerHTML = `<pre>${syntaxHighlight(data)}</pre>`;
                resultsSection.style.display = "block";

            } catch (error) {
                showError(error.message);
            } finally {
                // Reset loading state
                btnExtract.disabled = false;
                btnText.textContent = "Extract Data via Gemini 2.5 Flash";
                loader.style.display = "none";
            }
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
        }
    </script>
</body>
</html>
